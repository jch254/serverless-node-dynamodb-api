version: '3.7'
services:
  dynamodb:
    image: amazon/dynamodb-local
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/shell/ || exit 1"]
      interval: 1s
      timeout: 10s
      retries: 3
    ports:
      - "8000:8000"
    expose:
      - "8000"

  api:
    build:
      context: .
    depends_on:
      - dynamodb
    links:
      - dynamodb
    ports:
      - "3000:3000"
    restart: always
    healthcheck:
      test: "curl -f http://api/pingo"
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      DYNAMODB_HOST: dynamodb
      DYNAMODB_PORT: 8000
      DYNAMODB_NO_START: 'true'
